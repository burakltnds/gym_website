      <article class="hesap-kart">
        <h3>🔥 BMR Hesaplayıcı (Mifflin-St Jeor)</h3>
        <form id="bmrForm">
                        <label>Boy (cm):</label>
            <input type="number" id="boy" placeholder="Örn: 180" required>
        
           
        
            <label>Kilo (kg):</label>
            <input type="number" id="kilo" placeholder="Örn: 80" required>
            
            <label>Yaş:</label>
            <input type="number" id="yas" placeholder="Örn: 21" required>
          
            <label>Cinsiyet:</label>
            <div class="cinsiyet-grubu">
    
                <div class="radio-item">
    
                    <input type="radio" name="gender" id="erkek" value="male" checked>
    
                    <label for="erkek">Erkek</label>
    
                </div>
    
                <div class="radio-item">
    
                    <input type="radio" name="gender" id="kadin" value="female">
    
                    <label for="kadin">Kadın</label>
    
                </div>

            </div>
        
        
        
            <button type="button" onclick="bmrHesapla()">BMR Hesapla</button>
        </form>
    
        <div id="bmrSonuc">
            <p>Günlük Yakılan Kalori: <span id="bmrDeger"></span> kcal</p>
        </div>
    </article>


    <article class="hesap-kart">
        <h3>📊 BMI Hesaplayıcı</h3>
        <form id="bmiForm">
            <label>Boy (cm):</label>
            <input type="number" id="boy" placeholder="Örn: 180" required>
        
            
            <label>Kilo (kg):</label>
            <input type="number" id="kilo" placeholder="Örn: 80" required>
        
           
        
            <button type="button" onclick="bmiHesapla()">BMI Hesapla</button>
        </form>
    
        <div id="bmiSonuc">
            <p>Sonuç: <span id="bmiDeger">--</span></p>
            <p>Durum: <span id="bmiDurum">--</span></p>
        </div>
    </article>


    <article class="hesap-kart">
    <h3>🔍 Vücut Yağ Oranı Hesaplayıcı</h3>
    
    <form id="fatForm">
        <label>Boy (cm):</label>
        <input type="number" id="fat_boy" placeholder="180" required>
        
       
        
        <label>Bel Çevresi (cm)</small>:</label>
        <input type="number" id="fat_bel" placeholder="85" required>
        
       
        
        <label>Boyun Çevresi (cm):</label>
        <input type="number" id="fat_boyun" placeholder="40" required>
        
        
        
        <button type="button" onclick="yagHesapla()">Yağ Oranını Bul</button>
    </form>
    
    <div id="fatSonuc">
        <p>Vücut Yağ Oranı: %<span id="fatDeger">--</span></p>
        <p>Kategori: <span id="fatDurum">--</span></p>
    </div>
</article>
